# To deploy with GitHub Actions instead of the gh-pages branch, copy this file to
# .github/workflows/pages.yml and set Pages "Source" to "GitHub Actions" (pushing workflow files needs the `workflow` token scope).
name: Deploy static preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test shared engine + server
        run: npm test
      - name: Build client (static preview, repo base path)
        run: npm run build -w client
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_STATIC_PREVIEW: '1'
      - name: SPA fallback for deep links
        run: cp client/dist/index.html client/dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
